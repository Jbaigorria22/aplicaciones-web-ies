<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mateo Rivas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header-principal">
        <p><a href="index.html">Volver a Inicio</a></p>
    </header>

    <main class="contenido-contacto">
        <h1>Contacto</h1>

        <p>Contame brevemente sobre tu empresa y qué desafío ambiental están enfrentando. Te respondo en 48 horas
            para coordinar una primera reunión sin costo.</p>

        <form>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="email">Correo electrónico corporativo:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="empresa">Nombre de la empresa:</label><br>
            <input type="text" id="empresa" name="empresa"><br><br>

            <label for="tamanio">Tamaño de la empresa:</label><br>
            <select id="tamanio" name="tamanio">
                <option value="1-10">1 a 10 empleados</option>
                <option value="11-50">11 a 50 empleados</option>
                <option value="mas-50">Más de 50 empleados</option>
            </select><br><br>

            <label for="motivo">Motivo de la consulta o desafío principal:</label><br>
            <textarea id="motivo" name="motivo" rows="5" cols="40"></textarea><br><br>

            <input type="submit" value="Enviar">
        </form>
    </main>

    <footer class="footer-principal">
        <p>&copy; 2026 Mateo Rivas. Contacto: mateo.rivas@ejemplo.com</p>
    </footer>
</body>
</html>
