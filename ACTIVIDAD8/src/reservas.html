<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>
    <!-- mismo header que index.html para mantener el layout -->
    <header class="encabezado">
        <a href="index.html">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Retiro Sustentable - Ir al inicio" class="logo">
        </a>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html" class="activo" aria-current="page">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="principal">
        <h1>Reservas</h1>

        <section>
            <!-- h2 y no h4, para no saltear niveles después del h1 -->
            <h2>Contactanos</h2>

            <!-- post para que los datos no queden en la URL. action="#" hasta que haya backend -->
            <form action="#" method="post" class="formulario">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" required>

                <!-- tel abre el teclado numérico en celular -->
                <label for="telefono">Teléfono</label>
                <input type="tel" name="telefono" id="telefono" required>

                <!-- email valida el formato solo -->
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <label for="fecha-desde">Fecha desde</label>
                <input type="date" name="fecha-desde" id="fecha-desde" required>

                <label for="fecha-hasta">Fecha hasta</label>
                <input type="date" name="fecha-hasta" id="fecha-hasta" required>

                <label for="comentario">Comentario</label>
                <textarea name="comentario" id="comentario" rows="4"></textarea>

                <button type="submit">Enviar reserva</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Retiro Sustentable - Estudio Copan Arquitectura. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
